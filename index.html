<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f2ede3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Loom" />
    <meta
      name="description"
      content="Loom is a quiet, beautiful home for every kind of story — films, books, music, comics, games, videos, podcasts, and everything in between."
    />
    <title>Loom · everything you love, in one thread</title>
    <script>
      // Paint the right theme before React mounts so dark mode never flashes white.
      try {
        if (localStorage.getItem('loom.theme.v1') === 'dark') {
          document.documentElement.dataset.theme = 'dark';
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', '#11120f');
        }
      } catch (error) {
        /* private mode — light theme is fine */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
