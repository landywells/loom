[package]
name = "loom"
version = "1.0.0"
description = "Loom — a living archive of everything you love"
authors = ["Alex Rivera"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "loom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
# generate_context! expands into serde_json calls, so these are not optional.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# These two link against a window, so they cannot exist in the mobile build.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
panic = "abort"
strip = true
